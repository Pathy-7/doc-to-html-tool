<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Word to HTML Online Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Word to HTML Online Tool</h1>
    <div class="container">
        <!-- 左侧富文本编辑器 -->
        <div class="left">
            <h2>Paste Word Text Here</h2>
            <div id="inputEditor" class="editor" contenteditable="true" placeholder="Paste your Word content here..."></div>
            <button id="convertBtn">Convert to HTML →</button>
        </div>
        <!-- 右侧生成 HTML -->
        <div class="right">
            <h2>Generated HTML</h2>
            <textarea id="outputHtml" readonly></textarea>
            <button id="copyBtn">Copy HTML</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
